name: Bug report
description: Report a reproducible defect using synthetic data.
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include sample inputs, app version, and browser or OS. Remove credentials and live records.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Include redacted logs or screenshots and any inventory or delivery impact.
